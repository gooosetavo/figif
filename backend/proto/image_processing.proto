syntax = "proto3";

package imageprocessing;

option go_package = "github.com/figif/backend/proto";

// ImageProcessingService handles heavy image processing tasks
service ImageProcessingService {
  // RemoveBackground removes the background from an image
  rpc RemoveBackground(RemoveBackgroundRequest) returns (RemoveBackgroundResponse);

  // OptimizeGIF optimizes a GIF file
  rpc OptimizeGIF(OptimizeGIFRequest) returns (OptimizeGIFResponse);

  // ResizeImage resizes an image
  rpc ResizeImage(ResizeImageRequest) returns (ResizeImageResponse);

  // ProcessFrames processes multiple frames in a batch
  rpc ProcessFrames(stream ProcessFrameRequest) returns (stream ProcessFrameResponse);

  // ManualRemoveBackground removes background using manual selections
  rpc ManualRemoveBackground(ManualRemoveBackgroundRequest) returns (ManualRemoveBackgroundResponse);
}

message RemoveBackgroundRequest {
  bytes image_data = 1;
  string format = 2; // png, jpg, etc.
}

message RemoveBackgroundResponse {
  bytes processed_image = 1;
  string error = 2;
  int64 processing_time_ms = 3;
}

message OptimizeGIFRequest {
  bytes gif_data = 1;
  int32 quality = 2; // 1-100
  int32 max_width = 3;
  int32 max_height = 4;
}

message OptimizeGIFResponse {
  bytes optimized_gif = 1;
  int64 original_size = 2;
  int64 optimized_size = 3;
  string error = 4;
  int64 processing_time_ms = 5;
}

message ResizeImageRequest {
  bytes image_data = 1;
  int32 width = 2;
  int32 height = 3;
  bool maintain_aspect_ratio = 4;
}

message ResizeImageResponse {
  bytes resized_image = 1;
  string error = 2;
  int64 processing_time_ms = 3;
}

message ProcessFrameRequest {
  bytes frame_data = 1;
  int32 frame_index = 2;
  string operation = 3; // "resize", "filter", etc.
  map<string, string> params = 4;
}

message ProcessFrameResponse {
  bytes processed_frame = 1;
  int32 frame_index = 2;
  string error = 3;
  int64 processing_time_ms = 4;
}

// Selection point for magic wand
message SelectionPoint {
  int32 x = 1;
  int32 y = 2;
  int32 tolerance = 3;
}

message ManualRemoveBackgroundRequest {
  bytes image_data = 1;
  int32 width = 2;
  int32 height = 3;
  repeated SelectionPoint selections = 4;
  bool invert = 5;
  string effect = 6; // "none", "intensifies", "party", "on-drugs"
}

message ManualRemoveBackgroundResponse {
  bytes processed_image = 1;
  string error = 2;
  int64 processing_time_ms = 3;
}
